apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'androidx.navigation.safeargs.kotlin'
apply plugin: 'kotlin-kapt'


android {
    compileSdkVersion 36

    defaultConfig {
        applicationId "com.glowbird.gbeacon"
        minSdkVersion 29
        targetSdkVersion 36
        versionCode 1026
        versionName "1.0.2.6"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a' // 'armeabi-v7a' arm64-v8a 架构
        }


    }



    buildTypes {
        release {
            minifyEnabled false
            zipAlignEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }

        debug {
            minifyEnabled false
            zipAlignEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }


    packagingOptions {
        jniLibs {
            keepDebugSymbols += ['**/*.so']
        }
        resources {
            excludes += ['META-INF/ota_release.kotlin_module', 'META-INF/common_release.kotlin_module']
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['libs']
        }
    }

    buildFeatures{
        viewBinding = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
    namespace 'com.glowbird.gbeacon'


    applicationVariants.all { variant ->
        variant.outputs.all {
            if (buildType.name == 'release') {
                def createTime = new Date().format("YYYY-MM-dd", TimeZone.getTimeZone("GMT+08:00"))
                outputFileName = "GBeacon${defaultConfig.versionName}_${createTime}.apk"
            }
        }
    }






}

dependencies {

    implementation fileTree(include: ['*.jar','*.aar'], dir: 'libs')

    // GBeaconLib 以 AAR 形式引入（源码不在本仓库）；本地把 GBeaconLib-release.aar 放到 gbeacon/libs/ 即可
    implementation files('libs/GBeaconLib-release.aar')
    //implementation project(path: ':yxing')

    //rxpermissions
    //implementation 'com.tbruyelle.rxpermissions2:rxpermissions:0.9.5'
    //RxJava
    implementation "io.reactivex.rxjava3:rxjava:3.0.7"

    // AndroidX 和 Kotlin 核心依赖项
    implementation 'androidx.core:core-ktx:1.3.2'
    implementation 'androidx.appcompat:appcompat:1.3.0'
    implementation 'com.google.android.material:material:1.3.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.0.4'

    // Room 数据库依赖项
    implementation "androidx.room:room-runtime:$room_version"

    //implementation 'com.android.volley:volley:1.2.1'
    kapt "androidx.room:room-compiler:$room_version"


    // 仿ios 开关
    //implementation 'com.github.iielse:switchbutton:1.0.4'

    // Navigation 组件依赖项
    implementation "androidx.navigation:navigation-fragment-ktx:2.5.3"
    implementation "androidx.navigation:navigation-ui-ktx:2.5.3"
    implementation ("androidx.navigation:navigation-dynamic-features-fragment:2.5.3") {
        exclude group: 'com.google.android.play', module: 'core'
    }
    androidTestImplementation "androidx.navigation:navigation-testing:2.5.3"

    // 图片加载库
    implementation "com.github.bumptech.glide:glide:4.15.1"

    // PDF查看器
    //implementation 'com.github.barteksc:android-pdf-viewer:3.2.0-beta.1'

    // 异常处理框架
    implementation 'cat.ereza:customactivityoncrash:2.2.0'

    implementation 'com.github.JessYanCoding:AndroidAutoSize:v1.2.1'

    // 自定义键盘
    implementation 'com.king.keyboard:kingkeyboard:1.0.0'

    // Excel 处理
    implementation 'net.sourceforge.jexcelapi:jxl:2.6.12'

    // 动态权限管理
    implementation 'com.guolindev.permissionx:permissionx:1.6.4'

    implementation 'com.github.getActivity:XXPermissions:26.5'

    // Retrofit 网络请求库
    implementation "com.squareup.retrofit2:retrofit:$retrofit_version"
    implementation "com.squareup.retrofit2:converter-gson:$retrofit_version"

    // Lifecycle 组件依赖项
    implementation "androidx.lifecycle:lifecycle-extensions:$lifecycle_extensions_version"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:$lifecycle_viewmodel_version"
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:$lifecycle_livedata_version"

    // 下拉刷新
    implementation 'com.scwang.smartrefresh:SmartRefreshLayout:1.1.0'

    // 单元测试和 UI 测试依赖项
    testImplementation 'junit:junit:4.+'
    androidTestImplementation 'androidx.test.ext:junit:1.1.2'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.3.0'

    // 排除 com.google.android.play:core 依赖中的重复类
    implementation 'com.google.android.play:app-update:2.1.0'

    implementation 'com.blankj:utilcodex:1.31.1'

    implementation 'com.squareup.okhttp3:logging-interceptor:4.9.1'

    implementation 'com.mylhyl:zxingscanner:2.2.0'

    // CameraX + zxing：ui/utils/yxing 扫码组件（ScanCodeActivity / ScanCodeAnalyzer）需要的依赖
    def camerax_version = "1.4.0"
    implementation "androidx.camera:camera-core:$camerax_version"
    implementation "androidx.camera:camera-camera2:$camerax_version"
    implementation "androidx.camera:camera-lifecycle:$camerax_version"
    implementation "androidx.camera:camera-view:$camerax_version"
    implementation 'com.google.zxing:core:3.5.3'



}

